name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build images
        run: docker compose build

      - name: Deploy
        run: docker compose up -d

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 3
          done
          echo "backend did not become healthy" >&2
          exit 1
