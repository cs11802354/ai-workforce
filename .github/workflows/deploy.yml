name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Build images
        run: docker compose build

      # Gate the deploy on the trust eval. It replays a recorded tape, so it
      # needs no API keys and makes no network calls — a regression in the
      # consensus logic stops the deploy rather than reaching the site.
      - name: Multi-model trust eval
        run: |
          docker run --rm -v "$PWD/multi_model_trust:/work/multi_model_trust:ro" \
            -w /work ai-workforce-worker:latest \
            python -m multi_model_trust.eval.eval_harness

      - name: Deploy
        run: docker compose up -d

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 3
          done
          echo "backend did not become healthy" >&2
          exit 1
